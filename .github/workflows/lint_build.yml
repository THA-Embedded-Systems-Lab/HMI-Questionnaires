name: Lint and Build

on:
  push:
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Lint
        run: bun lint

      - name: Lint Markdown files
        run: bunx markdownlint-cli "**/*.md"
